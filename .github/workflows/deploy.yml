name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar (testes ja validados pelo workflow CI)
        run: mvn -B -ntp -DskipTests package

      - name: Build robo navegador
        run: mvn -B -ntp -f robo-navegador-saur/pom.xml -DskipTests package

      - name: Empacotar robo sem artefatos de build
        # O Chromium do Playwright NAO e mais baixado/empacotado aqui - baixar e reenviar por
        # SCP dezenas/centenas de MB toda vez, contra uma VM com rede possivelmente instavel,
        # estourava o timeout de 120s do step seguinte. Agora e baixado DIRETO NA VM (step
        # "Trocar jar e reiniciar o servico", junto do install-deps que ja rodava la) - o
        # Playwright e idempotente, entao rodar "install chromium" de novo num deploy que ja
        # tem a versao certa nao rebaixa nada. --exclude='.playwright' e defensivo (o diretorio
        # nem deveria existir aqui, ja que nao ha mais step de build que o crie).
        run: tar -czf /tmp/robo-navegador-saur.tgz --exclude='target' --exclude='report' --exclude='.playwright' --exclude='*.log' -C robo-navegador-saur .

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SAUR_ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 163.176.30.222 >> ~/.ssh/known_hosts

      - name: Enviar jar para a VM
        run: |
          scp -i ~/.ssh/deploy_key target/saur-0.0.1-SNAPSHOT.jar \
            ubuntu@163.176.30.222:/tmp/sgpur-novo.jar

      - name: Enviar robo navegador para a VM
        run: |
          timeout 30s ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=5 \
            ubuntu@163.176.30.222 \
            'rm -f /tmp/robo-navegador-saur.tgz'
          timeout 120s scp -i ~/.ssh/deploy_key /tmp/robo-navegador-saur.tgz \
            ubuntu@163.176.30.222:/tmp/robo-navegador-saur.tgz
          timeout 120s scp -i ~/.ssh/deploy_key \
            robo-navegador-saur/target/robo-navegador-saur-jar-with-dependencies.jar \
            ubuntu@163.176.30.222:/tmp/robo-navegador-saur.jar

      - name: Trocar jar e reiniciar o servico
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@163.176.30.222 '
            set -e
            sudo rm -rf /opt/sgpur/robo-navegador-saur.new
            sudo mkdir -p /opt/sgpur/robo-navegador-saur.new/target
            sudo tar -xzf /tmp/robo-navegador-saur.tgz -C /opt/sgpur/robo-navegador-saur.new
            sudo mv /tmp/robo-navegador-saur.jar /opt/sgpur/robo-navegador-saur.new/target/robo-navegador-saur-jar-with-dependencies.jar
            sudo rm -rf /opt/sgpur/robo-navegador-saur.old
            sudo mv /opt/sgpur/robo-navegador-saur /opt/sgpur/robo-navegador-saur.old 2>/dev/null || true
            sudo rm -rf /opt/sgpur/robo-navegador-saur
            sudo mv /opt/sgpur/robo-navegador-saur.new /opt/sgpur/robo-navegador-saur
            if [ ! -f /opt/sgpur/robo-navegador-saur/robo.config ]; then
              sudo cp /opt/sgpur/robo-navegador-saur/robo.config.production.template \
                /opt/sgpur/robo-navegador-saur/robo.config
            fi
            if [ -f /opt/sgpur/robo-navegador-saur.old/robo.env ]; then
              sudo cp /opt/sgpur/robo-navegador-saur.old/robo.env /opt/sgpur/robo-navegador-saur/robo.env
            fi
            if [ -d /opt/sgpur/robo-navegador-saur.old/report ]; then
              sudo cp -r /opt/sgpur/robo-navegador-saur.old/report /opt/sgpur/robo-navegador-saur/report
            fi
            sudo chown -R sgpur:sgpur /opt/sgpur/robo-navegador-saur
            sudo chmod 750 /opt/sgpur/robo-navegador-saur/run.sh
            echo "Baixando Chromium do Playwright direto na VM (idempotente, nao rebaixa se ja estiver na versao certa)..."
            sudo -u sgpur env PLAYWRIGHT_BROWSERS_PATH=/opt/sgpur/robo-navegador-saur/.playwright \
              java -cp /opt/sgpur/robo-navegador-saur/target/robo-navegador-saur-jar-with-dependencies.jar \
              com.microsoft.playwright.CLI install chromium
            sudo java -cp /opt/sgpur/robo-navegador-saur/target/robo-navegador-saur-jar-with-dependencies.jar com.microsoft.playwright.CLI install-deps chromium
            echo "Smoke test: Chromium consegue abrir e navegar de verdade na VM..."
            sudo -u sgpur env PLAYWRIGHT_BROWSERS_PATH=/opt/sgpur/robo-navegador-saur/.playwright \
              java -cp /opt/sgpur/robo-navegador-saur/target/robo-navegador-saur-jar-with-dependencies.jar \
              com.microsoft.playwright.CLI screenshot --browser chromium https://example.com /tmp/smoke-chromium.png
            sudo rm -f /tmp/smoke-chromium.png
            echo "Smoke test do Chromium OK."
            sudo cp /opt/sgpur/sgpur.jar /opt/sgpur/sgpur.jar.bak-$(date +%Y%m%d%H%M%S)
            sudo mv /tmp/sgpur-novo.jar /opt/sgpur/sgpur.jar
            sudo chown sgpur:sgpur /opt/sgpur/sgpur.jar
            sudo systemctl restart sgpur
            sleep 8
            sudo systemctl is-active sgpur
          '

      - name: Health check (HTTPS)
        run: |
          # Boot completo (app + conexao ao banco) pode levar dezenas de
          # segundos (ver CLAUDE.md) - o timeout antigo (sleep 5 + 5 retries
          # de 5s = ~30s no total) dava falso-negativo: o deploy tinha
          # funcionado, so o healthcheck desistia cedo demais. Valor de sleep
          # mantido conservador mesmo apos a migracao do banco (Neon -> Postgres
          # local na VM, 2026-07-25), que tende a deixar o boot mais rapido,
          # nao mais lento.
          sleep 60
          curl -Ikf --retry 10 --retry-delay 5 https://urgenciarenal.duckdns.org/login
