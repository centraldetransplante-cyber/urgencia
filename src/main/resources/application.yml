spring:
  application:
    name: saur
  # Carrega overrides locais (ex.: credenciais do Postgres) se o arquivo existir.
  # application-local.yml esta no .gitignore e NUNCA deve ser commitado.
  config:
    import: optional:classpath:application-local.yml
  profiles:
    active: dev

  # E-mail (SMTP) - configurado via application-local.yml ou env vars
  mail:
    host: ${SGPUR_MAIL_HOST:smtp.gmail.com}
    port: ${SGPUR_MAIL_PORT:587}
    username: ${SGPUR_MAIL_USER:}
    password: ${SGPUR_MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        from: ${SGPUR_MAIL_FROM:${SGPUR_MAIL_USER:}}

  thymeleaf:
    cache: false

  # Desliga o Open Session In View: o padrao do Spring Boot (true) mantem a
  # sessao Hibernate aberta ate a renderizacao da view, escondendo N+1 queries
  # e prendendo a conexao JDBC por mais tempo do que o necessario. Com false,
  # qualquer colecao lazy acessada so na view (Thymeleaf) estoura
  # LazyInitializationException - forcando os servicos a buscar os dados
  # explicitamente (fetch join / Hibernate.initialize), o que e o correto.
  jpa:
    open-in-view: false
  web:
    resources:
      # Cache longo so e seguro porque a chain abaixo poe o hash do conteudo no
      # NOME do arquivo (app-<hash>.css): mudou o arquivo, muda a URL. Sem esta
      # secao o Spring Security aplica "Cache-Control: no-store" tambem aos
      # estaticos e o navegador rebaixa CSS/JS inteiros a cada tela - o mesmo
      # efeito do ?v=timestamp que foi removido do layout.html.
      # Todos os estaticos servidos ao navegador sao referenciados via @{...}
      # nos templates, entao todos ganham o hash (nenhum escapa com URL fixa).
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: "/**"
  mvc:
    hiddenmethod:
      filter:
        enabled: true   # permite <input _method=PUT/DELETE> em formularios

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# Actuator: SOMENTE /actuator/health e exposto publicamente (permitAll no
# SecurityConfig), como health-check para monitoramento externo (ex.: um
# balanceador de carga ou um script de deploy checando se o boot terminou).
# Nenhum outro endpoint (/actuator/env, /actuator/beans, /actuator/mappings
# etc.) e habilitado - por padrao o Spring Boot so registra os endpoints
# listados em management.endpoints.web.exposure.include, e um endpoint nao
# registrado responde 404 mesmo que alguem descubra a URL (nao "200 porem
# vazio"). show-details=never evita expor detalhes internos (ex.: a URL do
# datasource) mesmo no unico endpoint liberado - so o status agregado
# (UP/DOWN) aparece, o suficiente para um health-check automatizado.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:3000}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # O Tomcat embutido tem um limite proprio para o corpo de requisicoes
  # POST/multipart, aplicado pelo conector ANTES do Spring MVC processar o
  # request - independente de spring.servlet.multipart.max-*. O default e
  # so 2MB; sem isso, qualquer anexo (ex.: scan de comprovante de parecer)
  # acima de 2MB dava 413 mesmo com os 25MB/30MB do Spring ja configurados
  # (causa raiz do erro 413 reportado em 2026-07-09, so agora diagnosticada).
  tomcat:
    max-http-form-post-size: 30MB
    max-swallow-size: 30MB

app:
  # Diretorio de armazenamento dos anexos
  anexos:
    dir: ./data/anexos
  # Usuario administrador inicial: AdminBootstrap so cria esse usuario se a
  # tabela usuario estiver vazia. Default (admin/admin123) vale para dev;
  # o perfil prod (application-prod.yml) exige SGPUR_ADMIN_PASSWORD via env
  # var e falha o boot se ela nao existir.
  admin:
    username: ${SGPUR_ADMIN_USER:admin}
    password: ${SGPUR_ADMIN_PASSWORD:Admin123!}
  # URL base da aplicacao, usada nos links do Portal do Avaliador nos e-mails.
  # Sobrescreva em producao com a URL publica real (ex.: https://saur.saude.rs.gov.br).
  base-url: ${SGPUR_BASE_URL:http://localhost:3000}

  # SEGURANCA DE TESTES: em dev, TODO e-mail enviado (independente do
  # destinatario real calculado pelo sistema) vai para este endereco -
  # nunca para avaliadores/solicitantes reais. So aparece aqui (nao em
  # application-prod.yml); em producao a variavel fica vazia e o envio usa
  # o destinatario real normalmente. Ver EmailSenderService.overrideRecipient.
  mail:
    override-recipient: ${SGPUR_MAIL_OVERRIDE:rafaelioppi@gmail.com}

  # Indicadores dos avaliadores: prazo-meta (SLA) em DIAS CORRIDOS para responder
  # um parecer. Tempos acima desse valor sao destacados como "fora do prazo" nos
  # KPIs de /membros e no Painel.
  avaliador:
    prazo-dias: ${SGPUR_PRAZO_AVALIADOR:7}

  # Varredura periodica de decisao automatica (DecisaoAutomaticaScheduler).
  # A decisao automatica normal e orientada a EVENTO (dispara no voto do
  # Portal do Avaliador); esta varredura e a REDE DE SEGURANCA para os
  # processos que ja tem maioria formada mas nunca vao receber um voto novo
  # (ex.: processo reaberto pelo ADMIN, decisao que falhou no instante do
  # voto, votos anteriores a existencia da automacao).
  #
  # DESLIGADA por padrao aqui (dev/teste): um job escrevendo no banco em
  # paralelo poluiria os testes. application-prod.yml liga por padrao.
  # Quando desligada, nem o componente nem o agendador do Spring sao
  # registrados (@ConditionalOnProperty em AgendamentoConfig).
  #
  # Intervalo de 15 min (fixedDelay, conta a partir do FIM da passada
  # anterior): a decisao em tempo real continua sendo a do evento (segundos);
  # esta varredura so precisa garantir que nenhum processo fique parado
  # indefinidamente. 15 min mantem o atraso maximo muito abaixo de qualquer
  # janela clinicamente relevante numa urgencia renal (cujo desfecho depende
  # de dias de fila no SNT, nao de minutos) e ao mesmo tempo e conservador
  # com o banco: ~96 consultas por dia, todas filtradas no proprio SQL.
  decisao-automatica:
    varredura:
      habilitado: ${SGPUR_VARREDURA_DECISAO:false}
      intervalo-ms: ${SGPUR_VARREDURA_DECISAO_INTERVALO_MS:900000}
      # Atraso da 1a execucao apos o boot: da tempo do AdminBootstrap e das
      # validacoes de schema terminarem antes de o job tocar em processos.
      atraso-inicial-ms: ${SGPUR_VARREDURA_DECISAO_ATRASO_MS:120000}

  # Lembrete automatico do Comprovante SNT (ComprovanteSntLembreteScheduler).
  # Um processo DEFERIDO fica travado (a equipe solicitante nao recebe a
  # comunicacao oficial) enquanto ninguem anexa o comprovante de insercao no
  # SNT - e nada cobrava esse anexo de ninguem. Esta varredura envia, uma vez
  # por dia, um e-mail aos ADMIN/OPERADOR ativos listando cada processo
  # Deferido ha mais de "prazo-dias" sem comprovante.
  #
  # DESLIGADA por padrao aqui (dev/teste), pelo mesmo motivo da varredura de
  # decisao automatica: job escrevendo no banco poluiria os testes.
  # application-prod.yml liga por padrao.
  #
  # prazo-dias e usado para as DUAS coisas: quantos dias apos a decisao o
  # primeiro lembrete e disparado e qual o intervalo minimo ate o proximo
  # lembrete do mesmo processo (nao reenvia todo dia).
  snt:
    lembrete:
      varredura:
        habilitado: ${SGPUR_SNT_LEMBRETE_HABILITADO:false}
        intervalo-ms: ${SGPUR_SNT_LEMBRETE_INTERVALO_MS:86400000}
        atraso-inicial-ms: ${SGPUR_SNT_LEMBRETE_ATRASO_MS:180000}
      prazo-dias: ${SGPUR_SNT_PRAZO_DIAS:7}

  # Portal do Solicitante (modulo experimental, ver docs/PLANO-SOLICITANTE.md):
  # kill-switch que registra ou nao SolicitanteController/triagem
  # (@ConditionalOnProperty). Ligado por padrao em dev; application-prod.yml
  # troca o default para desligado ate o time decidir usar de fato.
  solicitante:
    habilitado: ${SGPUR_SOLICITANTE_HABILITADO:true}

  # Google Gemini API (IA generativa). PROTECAO DE DADOS: "enabled" e o
  # kill-switch - quando false, GeminiService.perguntar() nem monta a chamada
  # (nenhum dado sai do servidor). Aqui (base/dev) fica ligado por padrao;
  # application-prod.yml troca o default para DESLIGADO, exigindo habilitacao
  # explicita (SGPUR_GEMINI_ENABLED=true) apos decisao formal de tratamento
  # de dados, ja que os recursos de IA enviam conteudo (documentos clinicos,
  # e-mail com nome do paciente) a um provedor externo.
  gemini:
    enabled: ${SGPUR_GEMINI_ENABLED:true}
    api-key: ${SGPUR_GEMINI_KEY:}
    model: ${SGPUR_GEMINI_MODEL:gemini-2.5-flash}

sgpur:
  # Textos literais e estaveis usados na geracao dos e-mails prontos
  # (EmailTemplateService): assinatura padrao e prefixo dos assuntos.
  # oficio-cidade tambem alimenta o Oficio de Indeferimento (OficioService):
  # e a cidade impressa na linha "Cidade, dd de mes de aaaa" - antes de
  # 2026-08-04 saia a palavra literal "Local," no documento oficial.
  email:
    assinatura: ${SGPUR_EMAIL_ASSINATURA:Equipe de Urgencia Renal - Secretaria de Saude}
    prefixo-assunto: ${SGPUR_EMAIL_PREFIXO_ASSUNTO:Urgencia Renal}
    oficio-cidade: ${SGPUR_OFICIO_CIDADE:Porto Alegre}
