# Perfil de producao - PostgreSQL (Neon / Vercel Postgres).
#
# O datasource (url/username/password) NAO fica aqui. Ele vem de:
#  - application-local.yml (gitignored) para rodar localmente contra o Neon, OU
#  - variaveis de ambiente no servidor de hospedagem:
#       SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  h2:
    console:
      enabled: false

# Actuator em producao: mesma politica minima do application.yml (so
# /actuator/health, sem detalhes, sem checar SMTP - ver comentario em
# application.yml) - repetido aqui explicitamente (nao herdado por
# acidente) para nunca depender de alguem lembrar de manter os dois perfis
# em sincronia.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# Roda atras do nginx com TLS (ver deploy/) - exige HTTPS para o cookie de
# sessao trafegar, evitando roubo de sessao em rede insegura.
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        same-site: lax

app:
  robo:
    # Script externo do robo, executado pelo servico web com argumentos fixos.
    script: ${SGPUR_ROBO_SCRIPT:/opt/sgpur/robo-navegador-saur/run.sh}
  admin:
    # Sem default aqui de proposito: se SGPUR_ADMIN_PASSWORD nao estiver
    # setada no ambiente, a resolucao deste placeholder falha e o boot
    # para - em vez de subir com a senha fraca "admin123" (default usado
    # so em dev, em application.yml).
    password: ${SGPUR_ADMIN_PASSWORD}
  mail:
    # Em producao o e-mail SEMPRE vai para o destinatario real - o override
    # de teste (application.yml, dev) fica explicitamente desligado aqui.
    override-recipient: ""
  # PROTECAO DE DADOS: em producao a IA fica DESLIGADA por padrao (default
  # diferente do application.yml/dev). So liga com SGPUR_GEMINI_ENABLED=true
  # apos decisao formal de tratamento de dados (ver GeminiService).
  gemini:
    enabled: ${SGPUR_GEMINI_ENABLED:false}
  # Modulo experimental (ver docs/PLANO-SOLICITANTE.md): desligado por padrao
  # em producao ate o time decidir usar. Liga com SGPUR_SOLICITANTE_HABILITADO=true.
  solicitante:
    habilitado: ${SGPUR_SOLICITANTE_HABILITADO:false}
  # Rede de seguranca da decisao automatica: LIGADA por padrao em producao
  # (default oposto ao de application.yml/dev, onde o job poluiria os testes).
  # E aqui que ela precisa rodar — o buraco que ela fecha (processo com
  # maioria formada e nenhum evento futuro para dispara-la) so acontece com
  # processos reais. Desliga com SGPUR_VARREDURA_DECISAO=false.
  decisao-automatica:
    varredura:
      habilitado: ${SGPUR_VARREDURA_DECISAO:true}
  # Lembrete automatico do Comprovante SNT: LIGADO por padrao em producao
  # (default oposto ao de application.yml/dev). E aqui que ele tem funcao —
  # cobrar da equipe o comprovante de um processo Deferido real que ficou
  # parado. Desliga com SGPUR_SNT_LEMBRETE_HABILITADO=false.
  snt:
    lembrete:
      varredura:
        habilitado: ${SGPUR_SNT_LEMBRETE_HABILITADO:true}
  # Varredura de limpeza dos mapas em memoria de rate-limit (login e
  # "esqueci minha senha"): LIGADA por padrao em producao (default oposto ao
  # de application.yml/dev). E aqui que ela evita vazamento de memoria de
  # longo prazo sob tentativas reais de usernames variados. Desliga com
  # SGPUR_RATE_LIMIT_LIMPEZA_HABILITADO=false.
  rate-limit:
    limpeza:
      varredura:
        habilitado: ${SGPUR_RATE_LIMIT_LIMPEZA_HABILITADO:true}
