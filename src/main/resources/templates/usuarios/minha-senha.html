<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Trocar minha senha')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4 container-narrow">
    <h1 class="h3 mb-3">Trocar minha senha</h1>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/usuarios/minha-senha}" method="post" class="card" id="formSenha">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" for="senhaAtual">Senha atual *</label>
                <div class="input-group">
                    <input type="password" name="senhaAtual" class="form-control" id="senhaAtual"
                           required autofocus autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" data-alvo-senha="senhaAtual"
                            title="Mostrar/ocultar senha atual" aria-label="Mostrar/ocultar senha atual">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="novaSenha">Nova senha *</label>
                <div class="input-group">
                    <input type="password" name="novaSenha" class="form-control" id="novaSenha"
                           required minlength="8" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" data-alvo-senha="novaSenha"
                            title="Mostrar/ocultar nova senha" aria-label="Mostrar/ocultar nova senha">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="form-text text-muted">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmacao">Confirmar nova senha *</label>
                <div class="input-group">
                    <input type="password" name="confirmacao" class="form-control" id="confirmacao"
                           required minlength="8" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" data-alvo-senha="confirmacao"
                            title="Mostrar/ocultar confirmação da nova senha" aria-label="Mostrar/ocultar confirmação da nova senha">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="text-danger small d-none" id="msgConfere">
                    A confirmação não confere com a nova senha.
                </div>
            </div>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{${inicioDoPerfil}}" class="btn btn-outline-secondary">Voltar</a>
            <button type="submit" class="btn btn-primary">Salvar nova senha</button>
        </div>
    </form>
</main>

<script th:replace="~{layout :: scripts}"></script>
<script th:src="@{/js/mostrar-senha.js}"></script>
<script th:src="@{/js/confere-senha.js}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
