<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Esqueci minha senha')}"></head>
<body class="auth-page-bg">
<div class="container auth-page-wrap">
    <div class="text-center mb-4 animate-fade-in">
        <div class="d-inline-flex align-items-center justify-content-center auth-icon-badge">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M52 10C34 32 20 52 20 66c0 18 14 28 30 28s30-10 30-28C80 52 66 32 52 10z" fill="var(--rs-gold)" opacity=".9"/>
                <rect x="40" y="44" width="18" height="30" rx="3" fill="rgba(255,255,255,.2)" opacity=".85"/>
                <rect x="32" y="54" width="34" height="12" rx="3" fill="rgba(255,255,255,.2)" opacity=".85"/>
            </svg>
        </div>
        <h1 class="h3 text-white mt-3 fw-bold auth-heading">SAUR</h1>
        <p class="text-white-70 small auth-subtitle">Redefinir senha</p>
    </div>
    <div class="card shadow-lg animate-fade-in-d1 auth-card">
        <div class="card-body p-4">
            <div th:if="${sucesso}" class="alert alert-success py-2" th:text="${msgRedefinicao}"></div>
            <div th:if="${erroRedefinicao}" class="alert alert-danger py-2" th:text="${erroRedefinicao}"></div>
            <p class="text-muted small mb-3" th:unless="${sucesso}">
                Informe seu login para receber, por e-mail, um link para
                definir uma nova senha. O link é válido por tempo limitado e
                só pode ser usado uma vez; até você abri-lo, sua senha atual
                continua funcionando normalmente.
            </p>
            <form th:action="@{/usuarios/esqueci-senha}" method="post" th:unless="${sucesso}">
                <div class="mb-3">
                    <label class="form-label" for="username">Login</label>
                    <input type="text" name="username" class="form-control" autofocus required id="username">
                </div>
                <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-muted small">Voltar ao login</a>
            </div>
        </div>
    </div>
    <p class="text-center text-white-70 mt-4 text-tiny-70">Produzido por Rafael Elias Ioppi</p>
</div>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
