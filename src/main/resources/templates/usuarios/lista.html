<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuários</h1>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo usuário
        </a>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form method="get" th:action="@{/usuarios}" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label small fw-semibold text-muted mb-1" for="q">Busca</label>
                    <input type="text" name="q" class="form-control form-control-sm" th:value="${q}"
                           placeholder="Login ou nome..." id="q" data-busca-atalho>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm"
                       title="Limpar filtro" aria-label="Limpar filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>Login</th><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th class="text-end">Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}" th:classappend="${!u.ativo} ? 'linha-inativa'">
                <td th:text="${u.username}">login</td>
                <td th:text="${u.nome}">Nome</td>
                <td>
                    <span th:if="${u.email != null and !u.email.isBlank()}" th:text="${u.email}">email@exemplo.com</span>
                    <span th:unless="${u.email != null and !u.email.isBlank()}" class="text-muted small">—</span>
                </td>
                <td><span class="badge bg-secondary" th:text="${u.perfil.descricao}">Perfil</span></td>
                <td>
                    <span th:if="${u.ativo}" class="text-nowrap">
                        <span th:replace="~{layout :: statusRotulo(true, 'Ativo')}"></span>
                    </span>
                    <span th:unless="${u.ativo}" class="text-nowrap">
                        <span th:replace="~{layout :: statusNa('Inativo')}"></span>
                    </span>
                </td>
                <td class="text-end">
                    <!-- Coluna de acoes no mesmo padrao de membros/ e
                         controle-urgencias/: flex container com gap consistente
                         (empilha no mobile, lado a lado a direita a partir de sm)
                         em vez de <a> + <form d-inline> soltos que quebravam de
                         forma irregular quando a coluna aperta. -->
                    <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-1">
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                        <form th:action="@{/usuarios/{id}/alternar-ativo(id=${u.id})}" method="post"
                              th:attr="data-confirm-msg=${u.ativo} ? ('Inativar o usuário &quot;' + ${u.username} + '&quot;? Ele perderá o acesso ao sistema.') : ('Reativar o usuário &quot;' + ${u.username} + '&quot;?')">
                            <button class="btn btn-sm btn-outline-warning w-100"
                                    th:text="${u.ativo} ? 'Inativar' : 'Ativar'">Inativar</button>
                        </form>
                        <form th:action="@{/usuarios/{id}/excluir(id=${u.id})}" method="post"
                              th:attr="data-confirm-msg='Excluir usuário &quot;' + ${u.username} + '&quot;? Esta ação não pode ser desfeita.'">
                            <button class="btn btn-sm btn-outline-danger w-100">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${usuarios.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-5">
                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                    <span th:if="${q != null and !q.isBlank()}">
                        Nenhum usuário encontrado para "<span th:text="${q}"></span>".
                        <a th:href="@{/usuarios}">Limpar filtro</a>
                    </span>
                    <span th:unless="${q != null and !q.isBlank()}">Nenhum usuário cadastrado.</span>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</main>

<div th:replace="~{layout :: confirmModal}"></div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: confirmarAcaoScript}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
