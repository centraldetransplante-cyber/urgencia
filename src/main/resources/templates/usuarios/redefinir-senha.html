<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Redefinir senha')}"></head>
<body class="auth-page-bg">
<div class="container auth-page-wrap">
    <div class="text-center mb-4 animate-fade-in">
        <div class="d-inline-flex align-items-center justify-content-center auth-icon-badge">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M52 10C34 32 20 52 20 66c0 18 14 28 30 28s30-10 30-28C80 52 66 32 52 10z" fill="var(--rs-gold)" opacity=".9"/>
                <rect x="40" y="44" width="18" height="30" rx="3" fill="rgba(255,255,255,.2)" opacity=".85"/>
                <rect x="32" y="54" width="34" height="12" rx="3" fill="rgba(255,255,255,.2)" opacity=".85"/>
            </svg>
        </div>
        <h1 class="h3 text-white mt-3 fw-bold auth-heading">SAUR</h1>
        <p class="text-white-70 small auth-subtitle">Redefinir senha</p>
    </div>
    <div class="card shadow-lg animate-fade-in-d1 auth-card">
        <div class="card-body p-4">

            <!-- Token invalido/expirado/ja usado: sem formulario, so a mensagem + link para pedir novo. -->
            <div th:if="${erroToken}">
                <div class="alert alert-danger py-2" th:text="${erroToken}"></div>
                <div class="text-center mt-3">
                    <a th:href="@{/usuarios/esqueci-senha}" class="btn btn-primary w-100">Solicitar nova redefinição</a>
                </div>
            </div>

            <!-- Token valido (ou reexibindo o form apos erro de senha/confirmacao): formulario de nova senha. -->
            <div th:if="${token}">
                <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>
                <p class="text-muted small mb-3">Defina sua nova senha de acesso ao SAUR.</p>
                <form th:action="@{/usuarios/redefinir-senha}" method="post" id="formRedefinir">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label class="form-label" for="novaSenha">Nova senha</label>
                        <div class="input-group">
                            <input type="password" name="novaSenha" class="form-control" id="novaSenha"
                                   required minlength="8" autofocus autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" data-alvo-senha="novaSenha"
                                    title="Mostrar/ocultar nova senha" aria-label="Mostrar/ocultar nova senha">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-text text-muted">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmacao">Confirmar nova senha</label>
                        <div class="input-group">
                            <input type="password" name="confirmacao" class="form-control" id="confirmacao"
                                   required minlength="8" autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" data-alvo-senha="confirmacao"
                                    title="Mostrar/ocultar confirmação" aria-label="Mostrar/ocultar confirmação">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="text-danger small d-none" id="msgConfere">
                            A confirmação não confere com a nova senha.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
                </form>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-muted small">Voltar ao login</a>
            </div>
        </div>
    </div>
    <p class="text-center text-white-70 mt-4 text-tiny-70">Produzido por Rafael Elias Ioppi</p>
</div>
<script th:replace="~{layout :: scripts}"></script>
<script th:src="@{/js/mostrar-senha.js}"></script>
<script th:if="${token}" th:src="@{/js/confere-senha.js}"></script>
</body>
</html>
