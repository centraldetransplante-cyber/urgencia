<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Urgencia')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<div class="container my-4" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${registro.id} ? 'Editar urgencia' : 'Nova urgencia'">Urgencia</h1>

    <form th:action="@{/controle-urgencias}" th:object="${registro}" method="post" class="card">
        <div class="card-body">
            <input type="hidden" th:field="*{id}">
            <!-- Lock otimista: carrega a versao lida junto com o formulario para
                 ControleUrgenciaService.atualizar detectar edicao concorrente
                 (ex.: renovacao feita por outro operador enquanto esta tela
                 estava aberta) em vez de sobrescrever em silencio. -->
            <input type="hidden" th:field="*{versao}">

            <div class="mb-3">
                <label class="form-label">Nome do paciente *</label>
                <input type="text" th:field="*{nomePaciente}" class="form-control" required>
                <div class="text-danger small" th:errors="*{nomePaciente}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">RGCT / SNT</label>
                    <input type="text" th:field="*{rgct}" class="form-control" placeholder="SNT-XXXX">
                </div>
                <div class="col-md-3">
                    <label class="form-label">ABO</label>
                    <select th:field="*{abo}" class="form-select">
                        <option value="">--</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="AB">AB</option>
                        <option value="O">O</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Vencimento</label>
                    <!-- Obrigatorio so na edicao: no cadastro, vazio significa
                         "calcular automaticamente hoje + 30 dias"
                         (ControleUrgenciaService.criar). Na edicao o registro ja
                         tem data e a coluna e NOT NULL. -->
                    <input type="date" th:field="*{dataVencimento}" class="form-control"
                           th:required="${registro.id != null}">
                    <div class="form-text text-muted" th:if="${registro.id == null}">
                        Vazio = hoje + 30 dias.
                    </div>
                    <div class="form-text text-muted" th:if="${registro.id != null}">
                        Use para <strong>corrigir</strong> a data. Para prorrogar por mais
                        30 dias, use o botao <strong>Renovar</strong> na lista.
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Equipe solicitante</label>
                <input type="text" th:field="*{equipe}" class="form-control" placeholder="Ex.: HCPA - Nefrologia">
            </div>

            <div class="mb-3">
                <label class="form-label">Observacoes</label>
                <textarea th:field="*{observacoes}" class="form-control" rows="3"></textarea>
            </div>
        </div>

        <div class="card-footer text-end">
            <a th:href="@{/controle-urgencias}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

<script th:replace="~{layout :: scripts}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
