<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Arquivo')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in">
        <div>
            <h1 class="h3 fw-bold mb-1"><i class="bi bi-archive me-2"></i>Arquivo</h1>
            <p class="text-muted small mb-0">
                Processos encerrados (Deferido, Indeferido, Cancelado)
                <span th:if="${totalEncerrados > 0}">
                    &bull; <span th:text="${totalEncerrados}">0</span> no total
                </span>
            </p>
        </div>
    </div>

    <div class="card border-0 shadow-sm animate-fade-in-d1">
        <div class="card-body p-3">
            <form method="get" th:action="@{/arquivo}" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label small fw-semibold text-muted mb-1" for="q">Busca</label>
                    <input type="text" name="q" class="form-control form-control-sm" th:value="${q}"
                           placeholder="Número, paciente ou solicitante..." id="q" data-busca-atalho>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/arquivo}" class="btn btn-outline-secondary btn-sm"
                       title="Limpar filtro" aria-label="Limpar filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm mt-3 animate-fade-in-d2">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">Processo</th>
                    <th>Solicitante</th>
                    <!-- Mesma centralizacao de /processos: as duas telas mostram
                         a mesma coluna e devem se comportar igual. -->
                    <th class="text-center">Situação</th>
                    <th class="text-center">Decisão</th>
                    <th class="pe-3 text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${processos}" class="animate-fade-in">
                    <td class="ps-3">
                        <a th:href="@{/processos/{id}(id=${p.id})}"
                           class="text-decoration-none fw-semibold text-primary"
                           th:text="${p.identificacao()}">00/0000 - Paciente - RGCT</a>
                        <span th:if="${p.isPreemptivo()}" class="badge bg-warning text-dark ms-1"
                              th:text="${T(br.gov.saude.sgpur.service.RotuloProcesso).tipoCurto(p)}">Preemptivo</span>
                    </td>
                    <td class="small">
                        <span class="badge badge-rs-blue fw-normal" th:text="${p.solicitanteEquipe}">Equipe</span>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill" th:classappend="${p.status.bootstrapBadge}">
                            <span th:replace="~{layout :: statusProcessoTexto(${p.status}, false)}">status</span>
                        </span>
                        <span th:replace="~{layout :: badgeEncerramento(${p}, 'ms-1')}"></span>
                        <span th:replace="~{layout :: badgeRegraDecisao(${regrasDecisao.get(p.id)}, 'ms-1')}"></span>
                        <span th:replace="~{layout :: badgeReaberturas(${p}, 'ms-1')}"></span>
                    </td>
                    <td class="small text-muted text-center"
                        th:text="${p.dataDecisao != null} ? ${#temporals.format(p.dataDecisao, 'dd/MM/yyyy')} : '-'">-</td>
                    <td class="text-end pe-3">
                        <a th:href="@{/processos/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-eye"></i> Abrir
                        </a>
                        <form th:action="@{/processos/{id}/reabrir(id=${p.id})}" method="post" class="d-inline"
                              sec:authorize="hasRole('ADMIN')"
                              data-confirm-msg="Reabrir este processo encerrado? Ele voltará para o status Enviado e poderá ser decidido novamente.">
                            <button class="btn btn-sm btn-outline-warning">
                                <i class="bi bi-arrow-counterclockwise"></i> Reabrir
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${processos.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-archive fs-2 d-block mb-2"></i>
                        Nenhum processo encerrado encontrado
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Paginacao no mesmo padrao de /processos e /auditoria ("N / total").
         Ate 2026-08-04 esta tela carregava TODOS os encerrados de uma vez. -->
    <nav class="mt-3 animate-fade-in-d3" th:if="${totalPaginas > 1}">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${paginaAtual == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/arquivo(q=${q}, page=${paginaAtual - 1})}">
                    <i class="bi bi-chevron-left"></i> Anterior
                </a>
            </li>
            <li class="page-item disabled">
                <span class="page-link fw-semibold">
                    <span th:text="${paginaAtual + 1}">1</span> / <span th:text="${totalPaginas}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="@{/arquivo(q=${q}, page=${paginaAtual + 1})}">
                    Próxima <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: confirmModal}"></div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: confirmarAcaoScript}"></script>
</body>
</html>
