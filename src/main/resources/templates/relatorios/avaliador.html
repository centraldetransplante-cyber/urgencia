<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Relatório por avaliador')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Relatório por avaliador</h1>
        <a th:href="@{/relatorios/anual}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Relatório anual
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="bi bi-person-lines-fill"></i> Relatório Individual do Avaliador por ano
        </div>
        <div class="card-body">
            <p class="text-muted">
                Gera um PDF com os processos que o médico avaliou no ano, o tempo
                de resposta de cada processo e a média geral dele.
            </p>

            <div th:if="${anos == null or anos.isEmpty() or membros == null or membros.isEmpty()}"
                 class="alert alert-info mb-0">
                <i class="bi bi-info-circle"></i>
                É preciso ter ao menos um processo cadastrado e um avaliador ativo
                para gerar este relatório.
            </div>

            <form th:if="${anos != null and !anos.isEmpty() and membros != null and !membros.isEmpty()}"
                  onsubmit="return false;" id="formAvaliador" class="row g-2 align-items-end"
                  th:attr="data-base=@{/relatorios/avaliador}">
                <div class="col-auto">
                    <label for="anoSelect" class="form-label">Ano</label>
                    <select id="anoSelect" class="form-select select-compact-220">
                        <option th:each="a : ${anos}" th:value="${a}" th:text="${a}">2026</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label for="membroSelect" class="form-label">Avaliador</label>
                    <select id="membroSelect" class="form-select" style="max-width: 260px;">
                        <option th:each="m : ${membros}" th:value="${m.id}" th:text="${m.rotulo}">Médico</option>
                    </select>
                </div>
                <div class="col-auto">
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <i class="bi bi-download"></i> Exportar como
                        </button>
                        <ul class="dropdown-menu">
                            <li><button type="button" id="btnExportarPdf" class="dropdown-item">
                                <i class="bi bi-filetype-pdf me-1"></i> PDF
                            </button></li>
                            <li><button type="button" id="btnExportarCsv" class="dropdown-item">
                                <i class="bi bi-filetype-csv me-1"></i> CSV
                            </button></li>
                            <li><button type="button" id="btnExportarHtml" class="dropdown-item">
                                <i class="bi bi-file-earmark-text me-1"></i> Visualizar HTML
                            </button></li>
                        </ul>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: relatorioPdfScript}"></script>
<script th:if="${anos != null and !anos.isEmpty() and membros != null and !membros.isEmpty()}"
        th:src="@{/js/relatorio-avaliador.js}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
