<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Auditoria')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
        <div>
            <h1 class="h3 mb-1">Auditoria</h1>
            <p class="text-muted small mb-0">
                Registro das ações realizadas no sistema (quem, o que e quando).
                <span th:if="${temFiltro}">
                    &bull; <strong th:text="${totalRegistros}">0</strong> registro(s) no filtro atual
                </span>
            </p>
        </div>
        <a class="btn btn-outline-secondary btn-sm"
           th:href="@{/auditoria/exportar(usuario=${usuario}, acao=${acao}, de=${de}, ate=${ate})}"
           title="Exportar os registros do filtro atual em CSV">
            <i class="bi bi-download me-1"></i> Exportar CSV
        </a>
    </div>

    <!-- Filtros: esta e a tela usada quando ja se sabe o que procurar ("o que
         o usuario X fez ontem", "quem excluiu este anexo"). Ate 2026-08-04 nao
         havia filtro nenhum - so paginar do mais recente para tras, 30 em 30. -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form method="get" th:action="@{/auditoria}" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-muted mb-1" for="fUsuario">Usuário</label>
                    <input type="text" name="usuario" id="fUsuario" class="form-control form-control-sm"
                           th:value="${usuario}" placeholder="parte do login..." data-busca-atalho>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-muted mb-1" for="fAcao">Ação</label>
                    <select name="acao" id="fAcao" class="form-select form-select-sm">
                        <option value="">Todas</option>
                        <option th:each="a : ${acoesDisponiveis}" th:value="${a}" th:text="${a}"
                                th:selected="${acao != null and acao == a}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold text-muted mb-1" for="fDe">De</label>
                    <input type="date" name="de" id="fDe" class="form-control form-control-sm" th:value="${de}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold text-muted mb-1" for="fAte">Até</label>
                    <input type="date" name="ate" id="fAte" class="form-control form-control-sm" th:value="${ate}">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/auditoria}" class="btn btn-outline-secondary btn-sm"
                       title="Limpar filtro" aria-label="Limpar filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th><th>IP</th></tr>
                </thead>
                <tbody>
                <th:block th:each="grupo : ${gruposPorDia}">
                    <!-- Cabecalho do dia -->
                    <tr class="table-light">
                        <td colspan="5" class="small fw-semibold text-muted">
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="${#temporals.format(grupo.key, 'dd/MM/yyyy')}">01/01/2026</span>
                        </td>
                    </tr>
                    <tr th:each="log : ${grupo.value}">
                        <td class="small text-nowrap"
                            th:text="${#temporals.format(log.dataHora, 'HH:mm:ss')}">hora</td>
                        <td th:text="${log.usuario}">usuário</td>
                        <td><span class="badge bg-secondary" th:text="${log.acao}">ACAO</span></td>
                        <td class="small text-truncate mw-15rem" th:text="${log.detalhe}" th:title="${log.detalhe}">detalhe</td>
                        <td class="small font-monospace text-muted"
                            th:text="${log.ip != null} ? ${log.ip} : '-'">-</td>
                    </tr>
                </th:block>
                <tr th:if="${gruposPorDia.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4"><i class="bi bi-journal-text d-block mb-1 fs-2 opacity-50"></i>
                        Nenhum registro de auditoria.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${totalPaginas > 1}">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${paginaAtual == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/auditoria(page=${paginaAtual - 1}, usuario=${usuario}, acao=${acao}, de=${de}, ate=${ate})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link">
                    <span th:text="${paginaAtual + 1}">1</span> / <span th:text="${totalPaginas}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="@{/auditoria(page=${paginaAtual + 1}, usuario=${usuario}, acao=${acao}, de=${de}, ate=${ate})}">Próxima</a>
            </li>
        </ul>
    </nav>
</main>

<script th:replace="~{layout :: scripts}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
