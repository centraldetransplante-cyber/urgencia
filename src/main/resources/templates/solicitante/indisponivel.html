<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Portal do Solicitante')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-5 container-narrow">
    <div class="card text-center">
        <div class="card-body py-5">
            <!-- Icone de envelope, nao de ferramentas (reparo do §5.4 do
                 docs/RELATORIO-REDESIGN-VISUAL-SOLICITANTE-2026-08.md): bi-tools
                 comunicava "sistema quebrado / em manutencao", quando a mensagem
                 real e "seu perfil ainda nao foi habilitado, siga usando o
                 e-mail de sempre". O envelope e fiel a acao que o texto pede. -->
            <i class="bi bi-envelope-paper fs-1" aria-hidden="true"></i>
            <h1 class="h4 mt-3 mb-2">Portal indisponível no momento</h1>
            <p class="text-muted mb-4">
                O envio de solicitações pelo sistema ainda não foi ativado para
                a sua equipe. Continue enviando o pedido de urgência renal pelo
                e-mail de sempre — a equipe de Urgência Renal vai analisar
                normalmente.
            </p>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </form>
        </div>
    </div>
</main>

<script th:replace="~{layout :: scripts}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
