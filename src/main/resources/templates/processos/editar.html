<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Editar processo')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <h1 class="h3 mb-3">Editar processo <span th:text="${processo.numero}">00/0000</span></h1>

    <form th:action="@{/processos/{id}/editar(id=${processo.id})}" th:object="${processo}"
          method="post" class="card" data-lock-submit="Salvando alterações...">
        <div class="card-body">
            <!-- 2026-08-27: mesma mudanca do Portal do Solicitante - checkbox
                 UNICO opcional em vez de 2 radios obrigatorios. Desmarcado
                 (padrao) = Urgencia Renal, sem exigir clique do operador. -->
            <div class="row g-3" th:if="${processo.status.name() == 'SOLICITADO'}">
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="tipoPreemptivo"
                               th:field="*{preemptivo}" onchange="atualizarTipoProcesso(this.checked)">
                        <label class="form-check-label" for="tipoPreemptivo">
                            Este é um processo de inserção preemptiva (paciente ainda não está na lista de espera do SNT)
                        </label>
                    </div>
                    <div class="form-text">
                        Alterar o tipo <strong>reemite o número</strong> do processo na série correta
                        (só é possível enquanto o processo ainda não foi enviado aos avaliadores).
                    </div>
                </div>
            </div>
            <input type="hidden" name="preemptivo" th:if="${processo.status.name() != 'SOLICITADO'}"
                   th:value="${processo.isPreemptivo() == true}">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" th:for="numero">Número</label>
                    <input type="text" th:field="*{numero}" class="form-control" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:for="dataSituacaoEspecial" id="labelDataSituacaoEspecial" th:text="${processo.isPreemptivo()} ? 'Data da solicitação *' : 'Data de solicitação da urgência renal *'">Data de solicitação da urgência renal *</label>
                    <input type="date" th:field="*{dataSituacaoEspecial}" class="form-control" th:classappend="${#fields.hasErrors('dataSituacaoEspecial')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('dataSituacaoEspecial')} ? 'true' : null,aria-describedby=${#fields.hasErrors('dataSituacaoEspecial')} ? 'dataSituacaoEspecialErro' : null">
                    <div class="invalid-feedback d-block" id="dataSituacaoEspecialErro" role="alert" th:errors="*{dataSituacaoEspecial}"></div>
                </div>
            </div>

            <hr>
            <h2 class="h6 text-muted">Receptor (paciente)</h2>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" th:for="pacienteNome">Nome do paciente *</label>
                    <input type="text" th:field="*{pacienteNome}" class="form-control" required th:classappend="${#fields.hasErrors('pacienteNome')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteNome')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteNome')} ? 'pacienteNomeErro' : null">
                    <div class="invalid-feedback d-block" id="pacienteNomeErro" role="alert" th:errors="*{pacienteNome}"></div>
                </div>
                <div class="col-md-4" id="blocoRgct" th:style="${processo.isPreemptivo()} ? 'display:none' : ''">
                    <label class="form-label" th:for="pacienteRgct" id="labelPacienteRgct">RGCT / SNT *</label>
                    <input type="text" th:field="*{pacienteRgct}" class="form-control" th:required="${!processo.isPreemptivo()}" th:classappend="${#fields.hasErrors('pacienteRgct')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteRgct')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteRgct')} ? 'pacienteRgctErro' : null">
                    <div class="invalid-feedback d-block" id="pacienteRgctErro" role="alert" th:errors="*{pacienteRgct}"></div>
                </div>
            </div>
            <div class="row g-3 mt-0">
                <div class="col-md-3">
                    <label class="form-label" th:for="pacienteDataNascimento">Data de nascimento *</label>
                    <input type="date" th:field="*{pacienteDataNascimento}" class="form-control" required th:classappend="${#fields.hasErrors('pacienteDataNascimento')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteDataNascimento')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteDataNascimento')} ? 'pacienteDataNascimentoErro' : null">
                    <div class="invalid-feedback d-block" id="pacienteDataNascimentoErro" role="alert" th:errors="*{pacienteDataNascimento}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:for="pacienteCpf">CPF *</label>
                    <input type="text" th:field="*{pacienteCpf}" class="form-control" maxlength="14" inputmode="numeric" placeholder="000.000.000-00" required th:classappend="${#fields.hasErrors('pacienteCpf')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteCpf')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteCpf')} ? 'pacienteCpfErro' : null">
                    <div class="invalid-feedback d-block" id="pacienteCpfErro" role="alert" th:errors="*{pacienteCpf}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:for="pacienteSexo">Sexo *</label>
                    <select th:field="*{pacienteSexo}" class="form-select" required th:classappend="${#fields.hasErrors('pacienteSexo')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteSexo')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteSexo')} ? 'pacienteSexoErro' : null">
                        <option value="">Selecione</option>
                        <option th:each="opcao : ${opcoesSexo}" th:value="${opcao.name()}" th:text="${opcao.descricao}"></option>
                    </select>
                    <div class="invalid-feedback d-block" id="pacienteSexoErro" role="alert" th:errors="*{pacienteSexo}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:for="pacienteNomeMae">Nome da mãe (opcional)</label>
                    <input type="text" th:field="*{pacienteNomeMae}" class="form-control" maxlength="200" th:classappend="${#fields.hasErrors('pacienteNomeMae')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('pacienteNomeMae')} ? 'true' : null,aria-describedby=${#fields.hasErrors('pacienteNomeMae')} ? 'pacienteNomeMaeErro' : null">
                    <div class="invalid-feedback d-block" id="pacienteNomeMaeErro" role="alert" th:errors="*{pacienteNomeMae}"></div>
                </div>
            </div>

            <hr>
            <h2 class="h6 text-muted">Equipe solicitante</h2>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" th:for="solicitanteEquipe">Equipe / hospital solicitante *</label>
                    <input type="text" th:field="*{solicitanteEquipe}" class="form-control" required th:classappend="${#fields.hasErrors('solicitanteEquipe')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('solicitanteEquipe')} ? 'true' : null,aria-describedby=${#fields.hasErrors('solicitanteEquipe')} ? 'solicitanteEquipeErro' : null">
                    <div class="invalid-feedback d-block" id="solicitanteEquipeErro" role="alert" th:errors="*{solicitanteEquipe}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" th:for="solicitanteEmail">E-mail do solicitante *</label>
                    <input type="email" th:field="*{solicitanteEmail}" class="form-control" required th:classappend="${#fields.hasErrors('solicitanteEmail')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('solicitanteEmail')} ? 'true' : null,aria-describedby=${#fields.hasErrors('solicitanteEmail')} ? 'solicitanteEmailErro' : null">
                    <div class="invalid-feedback d-block" id="solicitanteEmailErro" role="alert" th:errors="*{solicitanteEmail}"></div>
                </div>
                <div class="col-md-12">
                    <label class="form-label" th:for="emailAdicional">E-mail adicional para receber atualizações (opcional)</label>
                    <input type="email" th:field="*{emailAdicional}" class="form-control" maxlength="150" th:classappend="${#fields.hasErrors('emailAdicional')} ? 'is-invalid'" th:attr="aria-invalid=${#fields.hasErrors('emailAdicional')} ? 'true' : null,aria-describedby=${#fields.hasErrors('emailAdicional')} ? 'emailAdicionalErro' : null">
                    <div class="invalid-feedback d-block" id="emailAdicionalErro" role="alert" th:errors="*{emailAdicional}"></div>
                </div>
            </div>

            <hr>
            <div>
                <label class="form-label" th:for="observacoes">Observações</label>
                <textarea th:field="*{observacoes}" class="form-control" rows="8"></textarea>
            </div>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/processos/{id}(id=${processo.id})}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
    </form>
</main>

<div th:replace="~{layout :: footer}"></div>

<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: lockSubmitScript}"></script>
<script th:src="@{/js/processo-form.js}"></script>
</body>
</html>
