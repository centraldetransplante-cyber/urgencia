<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Solicitacoes online')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<main id="conteudo" class="container my-4">
    <h1 class="h3 mb-3"><i class="bi bi-inbox-fill"></i> Solicitações online — triagem</h1>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filtro == 'pendentes'} ? 'active'"
               th:href="@{/processos/solicitacoes-online(filtro='pendentes')}">
                <i class="bi bi-hourglass-split"></i> Pendentes
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${filtro == 'todas'} ? 'active'"
               th:href="@{/processos/solicitacoes-online(filtro='todas')}">
                <i class="bi bi-list-ul"></i> Todas
            </a>
        </li>
    </ul>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form method="get" th:action="@{/processos/solicitacoes-online}" class="row g-2 align-items-end">
                <input type="hidden" name="filtro" th:value="${filtro}">
                <div class="col-md-8">
                    <label class="form-label small fw-semibold text-muted mb-1" for="q">Busca</label>
                    <input type="text" name="q" class="form-control form-control-sm" th:value="${q}"
                           placeholder="Paciente, RGCT ou equipe..." id="q" data-busca-atalho>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1">
                        <i class="bi bi-search me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/processos/solicitacoes-online(filtro=${filtro})}" class="btn btn-outline-secondary btn-sm"
                       title="Limpar filtro" aria-label="Limpar filtro">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Paciente</th>
                        <th>RGCT</th>
                        <th>Equipe solicitante</th>
                        <th>Enviada em</th>
                        <th th:if="${filtro == 'todas'}">Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${solicitacoes}">
                        <td>
                            <span th:text="${s.pacienteNome}">Paciente</span>
                            <span th:if="${s.isPreemptivo()}" class="badge bg-warning text-dark ms-1"
                                  th:text="${T(br.gov.saude.sgpur.service.RotuloProcesso).tipoCurto(s)}"
                                  title="Paciente ainda não está na lista de espera do SNT">Preemptivo</span>
                        </td>
                        <td th:text="${s.pacienteRgct}">RGCT</td>
                        <td><span class="badge badge-rs-blue fw-normal" th:text="${s.solicitanteEquipe}">Equipe</span></td>
                        <td class="small text-muted">
                            <span th:text="${#temporals.format(s.dataEnvio, 'dd/MM/yyyy HH:mm')}">-</span>
                            <span th:if="${s.status.name() == 'ENVIADA'}"
                                  class="badge rounded-pill ms-1"
                                  th:classappend="${diasEspera.get(s.id).badgeClass}"
                                  th:text="${diasEspera.get(s.id).dias == 0} ? 'Enviado hoje' : (${diasEspera.get(s.id).dias} + (${diasEspera.get(s.id).dias == 1} ? ' dia de espera' : ' dias de espera'))"
                                  th:title="'Dias corridos desde o envio'">Enviado hoje</span>
                        </td>
                        <td th:if="${filtro == 'todas'}">
                            <span class="badge rounded-pill" th:classappend="${s.status.bootstrapBadge}">
                                <i class="bi" th:classappend="${'bi-' + s.status.badgeIcone}"></i>
                                <span th:text="${s.status.descricao}">Status</span>
                            </span>
                        </td>
                        <td class="text-end">
                            <span th:if="${idsComMsgNaoLidaSolicitante.contains(s.id)}"
                                  class="badge bg-warning text-dark me-1"
                                  title="Nova mensagem do solicitante">
                                <i class="bi bi-chat-dots-fill"></i>
                            </span>
                            <a th:href="@{/processos/solicitacoes-online/{id}(id=${s.id})}"
                               class="btn btn-sm btn-outline-primary"
                               title="Revisar os dados e escolher os 3 médicos avaliadores">
                                <i class="bi bi-eye"></i> Ver
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${solicitacoes.isEmpty()}">
                        <td th:colspan="${filtro == 'todas'} ? 6 : 5" class="text-center text-muted py-5">
                            <i class="bi bi-check2-all fs-2 d-block mb-2"></i>
                            <span th:text="${filtro == 'todas'} ? 'Nenhuma solicitação enviada ainda.' : 'Nenhuma solicitação aguardando triagem.'">-</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:replace="~{layout :: scripts}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
